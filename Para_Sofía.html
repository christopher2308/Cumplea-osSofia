<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Para Sofía</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: one night-sky card. Greeting in the upper middle, balloons at the side edges,
   cake centred on the floor with a teddy bear on each side. Single look by choice (night scene). */
:root {
  --night-top: #150f3d;
  --night-mid: #3a1d73;
  --night-low: #6d2f8f;
  --floor: #25135a;
  --ink: #fff6ea;
  --gold: #ffcf4a;
  --pink: #ff6fa5;
  --mint: #59d6b3;
  --sky: #5ab8ff;
  --coral: #ff7a5c;
  --lilac: #b79cff;
  --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: #0f0a2e;
  color: var(--ink);
  font-family: var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
.wrap {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

/* ---------- Stage ---------- */
.stage {
  position: relative;
  isolation: isolate;
  width: min(100%, 480px, calc((100dvh - 120px) * 0.75));
  aspect-ratio: 3 / 4;
  container-type: size;
  border-radius: 28px;
  overflow: hidden;
  background: linear-gradient(180deg, var(--night-top) 0%, var(--night-mid) 58%, var(--night-low) 100%);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
}
.el { position: absolute; }
.o0 { opacity: 0; }
.still .o0 { opacity: 1; }

.stars { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.star {
  position: absolute;
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: #fff;
  opacity: 0.25;
  animation: tw 3s ease-in-out var(--d) infinite alternate;
}
.floor {
  left: 0; right: 0; bottom: 0; height: 11%;
  background: linear-gradient(180deg, #3a1b78, var(--floor));
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  z-index: 1;
}
.fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

/* ---------- Cake ---------- */
.cake { left: 27%; bottom: 6.5%; width: 46%; z-index: 4; }
.cake svg { width: 100%; height: auto; display: block; }
.flame {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: flick 0.22s ease-in-out infinite alternate;
}
.flame.f2 { animation-duration: 0.27s; }
.flame.f3 { animation-duration: 0.19s; }

/* ---------- Bears ---------- */
.bear { width: 24%; bottom: 5%; z-index: 6; transform-origin: 50% 100%; }
.bear svg { width: 100%; height: auto; display: block; }
.bear.l { left: 3%; --fur: #c98b5a; --fur2: #f1c9a0; --bow: #ff6fa5; }
.bear.r { right: 3%; --fur: #b9a2ef; --fur2: #e6dcff; --bow: #ffcf4a; }

/* ---------- Balloons ---------- */
.balloon { left: var(--x); top: var(--y); width: var(--w); z-index: 5; }
.balloon svg { width: 100%; height: auto; display: block; color: var(--c); }

/* ---------- Greeting ---------- */
.msg {
  position: absolute; left: 0; right: 0; top: 14%;
  padding-inline: 5%;
  text-align: center;
  z-index: 8;
  pointer-events: none;
}
.l1 { font: 600 7.2cqw/1.15 var(--f-display); letter-spacing: 0.01em; }
.name {
  font: 700 27cqw/0.95 var(--f-display);
  color: var(--gold);
  text-shadow: 0 0.035em 0 #e0568f, 0 0.09em 0.22em rgba(0, 0, 0, 0.35);
  margin-block: 1cqw;
  white-space: nowrap;
}
.l { display: inline-block; }
.wish {
  font: 600 6.4cqw/1.2 var(--f-display);
  color: #ffd9ea;
  display: inline-flex;
  align-items: center;
  gap: 0.35em;
}
.hrt { width: 0.9em; height: 0.9em; color: var(--pink); }
.heart {
  position: absolute; left: var(--x); bottom: 40%;
  width: 7cqw; color: var(--c, var(--pink));
  opacity: 0; z-index: 7;
}

/* ---------- Cover ---------- */
.cover {
  position: absolute; inset: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3cqh; text-align: center;
  transition: opacity 0.7s ease, visibility 0.7s;
}
.cover.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.gift { width: 32cqw; }
.gift svg { width: 100%; height: auto; display: block; animation: bob 2.6s ease-in-out infinite; }
.eyebrow {
  font: 800 4.6cqw/1.2 var(--f-body);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: #cdbcff;
}
.cover .name { font-size: 22cqw; }
.btn {
  font: 700 5.4cqw/1 var(--f-display);
  padding: 0.8em 1.5em;
  border: 0; border-radius: 999px;
  background: var(--gold); color: #3a1b5c;
  cursor: pointer;
  box-shadow: 0 0.6cqw 0 #c98f00, 0 3cqw 8cqw rgba(255, 207, 74, 0.35);
  animation: pulse 1.8s ease-in-out infinite;
}
.btn:active { transform: translateY(0.6cqw); }
.btn:focus-visible, .replay:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

.bar { height: 48px; display: flex; align-items: center; justify-content: center; }
.replay {
  font: 600 16px/1 var(--f-display);
  padding: 12px 22px;
  border-radius: 999px;
  border: 2px solid rgba(255, 255, 255, 0.35);
  background: transparent; color: var(--ink);
  cursor: pointer;
}
.replay:hover { background: rgba(255, 255, 255, 0.08); }

/* ---------- Timeline (about 9 s) ---------- */
.play .floor { animation: fadeIn 0.6s ease-out both; }
.play .cake { animation: drop 1s linear 0.3s both; }
.play .balloon {
  animation:
    rise 2.6s cubic-bezier(0.22, 0.7, 0.25, 1) var(--d) both,
    bob 3.6s ease-in-out calc(var(--d) + 2.6s) infinite;
}
.play .bear {
  animation:
    pop 0.8s cubic-bezier(0.3, 1.4, 0.5, 1) var(--d) both,
    wiggle 2.4s ease-in-out calc(var(--d) + 0.8s) infinite;
}
.play .l1 { animation: rise2 0.8s ease-out 3.4s both; }
.play .l { animation: letter 0.7s cubic-bezier(0.3, 1.5, 0.5, 1) calc(4.2s + var(--i) * 0.1s) both; }
.play .wish { animation: rise2 0.9s ease-out 5.6s both; }
.play .heart { animation: floatUp 2.4s ease-out var(--d) both; }

@keyframes tw { to { opacity: 0.95; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes flick {
  from { transform: scale(1, 1) rotate(-3deg); }
  to { transform: scale(0.9, 1.12) rotate(3deg); }
}
@keyframes drop {
  0%   { opacity: 1; transform: translateY(-120cqh); animation-timing-function: cubic-bezier(0.5, 0, 0.9, 0.6); }
  55%  { opacity: 1; transform: translateY(0); animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
  72%  { opacity: 1; transform: translateY(-5cqh); animation-timing-function: cubic-bezier(0.5, 0, 0.9, 0.6); }
  86%  { opacity: 1; transform: translateY(0); animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
  94%  { opacity: 1; transform: translateY(-1.5cqh); animation-timing-function: cubic-bezier(0.5, 0, 0.9, 0.6); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes rise {
  from { opacity: 1; transform: translateY(120cqh); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-1.4cqh) rotate(2deg); }
}
@keyframes pop {
  from { opacity: 1; transform: scale(0) rotate(-20deg); }
  to   { opacity: 1; transform: scale(1) rotate(0); }
}
@keyframes wiggle {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-3deg); }
  75% { transform: rotate(3deg); }
}
@keyframes rise2 {
  from { opacity: 0; transform: translateY(3cqh); }
  to   { opacity: 1; transform: none; }
}
@keyframes letter {
  from { opacity: 0; transform: translateY(5cqh) scale(0.4); }
  to   { opacity: 1; transform: none; }
}
@keyframes floatUp {
  0%   { opacity: 0; transform: translateY(0) scale(0.5); }
  15%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(-16cqh) scale(1); }
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .star { opacity: 0.6; }
}
</style>

<script>
(function () {
  var stage = document.getElementById('stage');
  var cover = document.getElementById('cover');
  var openBtn = document.getElementById('open');
  var replayBtn = document.getElementById('replay');
  var starsEl = document.getElementById('stars');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Stars
  for (var i = 0; i < 40; i++) {
    var s = document.createElement('i');
    s.className = 'star';
    var size = (1 + Math.random() * 2.2).toFixed(1) + 'px';
    s.style.cssText = 'left:' + (Math.random() * 100).toFixed(1) + '%;top:' + (Math.random() * 70).toFixed(1) +
      '%;--s:' + size + ';--d:' + (Math.random() * 3).toFixed(2) + 's';
    starsEl.appendChild(s);
  }

  // Fireworks
  var fx = (function () {
    var cv = document.getElementById('fx');
    var ctx = cv.getContext('2d');
    var COLORS = ['#ffcf4a', '#ff6fa5', '#59d6b3', '#5ab8ff', '#ff7a5c', '#d9c8ff', '#ffffff'];
    var W = 0, H = 0, rockets = [], sparks = [], raf = 0, last = 0, stillMode = false;

    function size() {
      var r = cv.getBoundingClientRect();
      var d = Math.min(window.devicePixelRatio || 1, 2);
      W = r.width; H = r.height;
      cv.width = Math.round(W * d);
      cv.height = Math.round(H * d);
      ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    function pick() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }
    function burst(x, y) {
      var k = W / 480, c1 = pick(), c2 = pick(), ring = Math.random() < 0.5, n = ring ? 46 : 64;
      for (var i = 0; i < n; i++) {
        var a = Math.PI * 2 * i / n + Math.random() * 0.1;
        var sp = (ring ? 130 : (50 + Math.random() * 130)) * k;
        sparks.push({
          x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 0, max: 1.1 + Math.random() * 0.8,
          c: i % 3 === 0 ? c2 : c1, r: (1.6 + Math.random() * 1.4) * k
        });
      }
    }
    function run() {
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
    }
    function launch(xf) {
      if (!W) size();
      rockets.push({ x: xf * W, ty: H * (0.1 + Math.random() * 0.2), p: 0 });
      run();
    }
    function tick(now) {
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      var k = W / 480;
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      rockets = rockets.filter(function (r) {
        r.p += dt / 0.8;
        var e = 1 - Math.pow(1 - Math.min(r.p, 1), 2);
        var y = H + (r.ty - H) * e;
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#fff3c4';
        ctx.beginPath(); ctx.arc(r.x, y, 2 * k, 0, 6.283); ctx.fill();
        ctx.strokeStyle = 'rgba(255,243,196,0.5)';
        ctx.lineWidth = 1.5 * k;
        ctx.beginPath(); ctx.moveTo(r.x, y); ctx.lineTo(r.x, y + 22 * k * (1 - e) + 6); ctx.stroke();
        if (r.p >= 1) { burst(r.x, y); return false; }
        return true;
      });
      var g = 120 * k;
      sparks = sparks.filter(function (s) {
        s.life += dt;
        if (s.life >= s.max) return false;
        s.vx *= 0.985; s.vy = s.vy * 0.985 + g * dt;
        s.x += s.vx * dt; s.y += s.vy * dt;
        var a = 1 - s.life / s.max;
        ctx.globalAlpha = a;
        ctx.fillStyle = s.c;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.6 + 0.4 * a), 0, 6.283); ctx.fill();
        return true;
      });
      ctx.globalAlpha = 1;
      if (rockets.length || sparks.length) {
        raf = requestAnimationFrame(tick);
      } else {
        raf = 0;
        ctx.clearRect(0, 0, W, H);
      }
    }
    function stop() {
      if (raf) cancelAnimationFrame(raf);
      raf = 0; rockets = []; sparks = []; stillMode = false;
      if (W) ctx.clearRect(0, 0, W, H);
    }
    function still() {
      stillMode = true;
      size();
      ctx.globalCompositeOperation = 'lighter';
      [[0.22, 0.2, '#ffcf4a'], [0.78, 0.16, '#ff6fa5'], [0.5, 0.08, '#59d6b3']].forEach(function (b) {
        for (var i = 0; i < 36; i++) {
          var a = Math.PI * 2 * i / 36, rr = W * (0.07 + (i % 2) * 0.025);
          ctx.globalAlpha = 0.85;
          ctx.fillStyle = b[2];
          ctx.beginPath();
          ctx.arc(b[0] * W + Math.cos(a) * rr, b[1] * H + Math.sin(a) * rr, 2.2, 0, 6.283);
          ctx.fill();
        }
      });
      ctx.globalAlpha = 1;
    }
    window.addEventListener('resize', function () {
      size();
      if (stillMode) still();
    });
    return { launch: launch, stop: stop, still: still, size: size };
  })();

  // Timeline
  var BURSTS = [[1300, 0.5], [2100, 0.2], [2600, 0.8], [3300, 0.35], [3900, 0.7], [4600, 0.15],
                [5200, 0.85], [5900, 0.5], [6600, 0.25], [7300, 0.75], [8000, 0.5]];
  var timers = [];
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearAll() { timers.forEach(clearTimeout); timers = []; fx.stop(); }

  function play() {
    clearAll();
    stage.classList.remove('play', 'still');
    replayBtn.hidden = true;
    cover.classList.add('gone');
    void stage.offsetWidth;
    if (reduce) {
      stage.classList.add('still');
      fx.still();
      replayBtn.hidden = false;
      return;
    }
    fx.size();
    stage.classList.add('play');
    BURSTS.forEach(function (b) { later(function () { fx.launch(b[1]); }, b[0]); });
    later(function () { replayBtn.hidden = false; }, 8600);
  }

  openBtn.addEventListener('click', play);
  replayBtn.addEventListener('click', play);
})();
</script>

</body></html>
